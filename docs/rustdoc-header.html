<!-- Renders ```mermaid fenced blocks in rustdoc output.

     rustdoc emits a non-Rust fenced block as <pre class="language-mermaid">,
     which mermaid does not recognise on its own, so each one is rewritten to
     the <pre class="mermaid"> shape mermaid initializes. Diagrams degrade to
     their source text when the CDN is unreachable, so the docs stay readable
     offline. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
  const blocks = document.querySelectorAll("pre.language-mermaid");
  for (const block of blocks) {
    const figure = document.createElement("pre");
    figure.className = "mermaid";
    figure.textContent = block.textContent;
    block.replaceWith(figure);
  }
  if (blocks.length) {
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
