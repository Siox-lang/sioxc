[package]
name = "siox"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Siox-lang/sioxc"
authors = ["siox contributors"]
description = "The siox compiler"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
# The released Inkwell 0.10.0 tag lacks LLVM 23 bindings; pin the probed revision.
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "c8234a0ee4171e946f94f6b3b5da0ea8d6ef5f3b", optional = true, default-features = false, features = ["llvm23-1-prefer-dynamic", "target-x86"] }

[features]
default = ["cli"]
cli = ["dep:clap", "llvm"]
llvm = ["dep:inkwell"]
simd = []
bitpack = []

[lib]
name = "siox"
path = "src/lib.rs"

[[bin]]
name = "sioxc"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
