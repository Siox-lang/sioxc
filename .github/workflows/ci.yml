name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check frontend without CLI or LLVM
        run: cargo check --locked --no-default-features --lib

      - name: Lint frontend
        run: cargo clippy --locked --no-default-features --lib -- -D warnings

  compiler:
    name: LLVM, native, bitpack, and corpus
    # Cached GDB links against this image's Python runtime.
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_231_PREFIX: /usr/lib/llvm-23
      LLVM_SYS_231_STRICT_VERSIONING: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check out runnable corpus
        uses: actions/checkout@v5
        with:
          repository: Siox-lang/siox-tests
          path: siox-tests

      - name: Check specified Phase 1 example artifacts
        run: python3 scripts/check-phase1-examples.py "$GITHUB_WORKSPACE/siox-tests"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy

      - name: Install LLVM 23 and Clang
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y clang-23 llvm-23-dev libpolly-23-dev
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          llvm-config-23 --version
          clang-23 --version

      - name: Install GDB build dependencies
        run: sudo apt-get install -y build-essential texinfo python3-dev libgmp-dev libmpfr-dev libreadline-dev zlib1g-dev

      - name: Cache GDB 18.1
        id: gdb
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/gdb-18.1
          key: gdb-18.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build GDB 18.1 with Python support
        if: steps.gdb.outputs.cache-hit != 'true'
        env:
          GDB_PREFIX: ${{ runner.tool_cache }}/gdb-18.1
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o gdb-18.1.tar.xz https://sourceware.org/pub/gdb/releases/gdb-18.1.tar.xz
          echo "e7079ad31e6176391a4d278c85a668cc92c13c8dc1f4937f3d4438f9dc7afdbb12083af7f86e17e854b3d23c3ceff80c63bdbbc8e18b0cf9962656f75ab8b5a0  gdb-18.1.tar.xz" | sha512sum --check
          tar -xf gdb-18.1.tar.xz
          mkdir gdb-build
          cd gdb-build
          ../gdb-18.1/configure --prefix="$GDB_PREFIX" --with-python=/usr/bin/python3 \
            --disable-gdbserver --disable-sim --disable-nls \
            --without-guile --without-debuginfod --without-source-highlight
          make -j2
          make install

      - name: Select and verify GDB 18.1
        env:
          GDB_PREFIX: ${{ runner.tool_cache }}/gdb-18.1
        run: |
          echo "$GDB_PREFIX/bin" >> "$GITHUB_PATH"
          "$GDB_PREFIX/bin/gdb" --version
          "$GDB_PREFIX/bin/gdb" --batch --nx \
            -ex 'python assert gdb.VERSION.startswith("18.1")' \
            -ex 'python assert hasattr(gdb.Value, "is_unavailable")'

      - uses: Swatinem/rust-cache@v2

      - name: Build compiler
        run: cargo build --locked

      - name: Test default backend
        run: cargo test --locked

      - name: Verify native and Siox source debugging
        run: bash scripts/test-gdb.sh "$GITHUB_WORKSPACE/siox-tests"

      - name: Test bitpack backend
        run: cargo test --locked --features bitpack

      - name: Lint all targets and backends
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Compile and run corpus
        run: ./scripts/test-corpus.sh "$GITHUB_WORKSPACE/siox-tests"

      # The packed value representation was reached only by the unit tests.
      # The corpus is what exercises a backend end to end.
      - name: Compile and run corpus (bitpack)
        run: SIOXC_FEATURES=bitpack ./scripts/test-corpus.sh "$GITHUB_WORKSPACE/siox-tests"
