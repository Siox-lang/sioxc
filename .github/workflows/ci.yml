name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check frontend without CLI or LLVM
        run: cargo check --locked --no-default-features --lib

  compiler:
    name: LLVM, native, bitpack, and corpus
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Check out runnable corpus
        uses: actions/checkout@v5
        with:
          repository: Siox-lang/siox-tests
          path: siox-tests

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install LLVM 22 and Clang
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 llvm-22-dev libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build compiler
        run: cargo build --locked

      - name: Test default backend
        run: cargo test --locked

      - name: Test bitpack backend
        run: cargo test --locked --features bitpack

      - name: Compile and run corpus
        run: ./scripts/test-corpus.sh "$GITHUB_WORKSPACE/siox-tests"
